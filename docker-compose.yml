name: fixpoint-review

services:
  app:
    build: .
    image: fixpoint-review:local
    environment:
      PORT: "${PORT:-8000}"
      DATA_DIR: /data
    volumes:
      - review-data:/data
    ports:
      - "${APP_PORT:-8080}:${PORT:-8000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('PORT','8000')+'/health',timeout=3)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    build: .
    image: fixpoint-review:local
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:${PORT:-8000}
      DATA_DIR: /tmp/verify-data
    restart: "no"
    command: ["python", "-m", "verify.run"]

volumes:
  review-data:
